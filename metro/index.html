  <noscript>
    <p style="font-family:sans-serif;padding:24px;color:#12263A">イスラエルの交通課題と公共交通網、計画中のテルアビブ・メトロを紹介。都市の成長、交通ネットワークの連携、駅周辺のまちづくりを、日本との専門交流に向けて解説します。</p>
  </noscript>
  <script>
    (function () {
      if (location.protocol === 'file:') {
        var fileRoot = location.href.replace(/metro\/index\.html.*$/, '').replace(/metro\/?(?:[?#].*)?$/, '');
        if (fileRoot.slice(-1) !== '/') fileRoot += '/';
        location.replace(fileRoot + 'index.html?page=metro');
        return;
      }
      var root = location.pathname.replace(/\/metro\/index\.html$/, '/').replace(/\/metro\/?$/, '/');
      if (root.charAt(root.length - 1) !== '/') root += '/';
      var baseEl = document.createElement('base');
      baseEl.href = root;
      document.head.appendChild(baseEl);
      window.FORUMETRO_PAGE = 'metro';
      fetch(root + 'index.html', { credentials: 'same-origin' }).then(function (res) {
        if (!res.ok) throw new Error('missing');
        return res.text();
      }).then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('head style').forEach(function (node) {
          document.head.appendChild(document.adoptNode(node));
        });
        document.body.textContent = '';
        while (doc.body.firstChild) document.body.appendChild(document.adoptNode(doc.body.firstChild));
        document.body.querySelectorAll('script').forEach(function (old) {
          var fresh = document.createElement('script');
          var src = old.getAttribute('src');
          if (src) fresh.src = src;
          else fresh.textContent = old.textContent;
          old.parentNode.replaceChild(fresh, old);
        });
      }).catch(function () {
        document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">The Metro Project page did not open. <a href="' + root + '">Back to the site</a>.</p>';
      });
    })();
  </script>
